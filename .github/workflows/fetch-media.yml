# One-shot helper: downloads the reference-driven Seedance 2.0 clips
# (generated via the Higgsfield MCP from client-approved stills) and commits
# them plus extracted poster frames. Run manually via workflow_dispatch.
name: Fetch generated media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Seedance clips
        run: |
          mkdir -p public/videos public/posters
          base="https://d8j0ntlcm91z4.cloudfront.net/user_3G4vT0leBNeViaTHBbsao3dtR2N"
          fetch() { curl -fsSL -o "public/videos/$1.mp4" "$base/$2.mp4" || rm -f "public/videos/$1.mp4"; }
          fetch control-room "hf_20260706_111100_5711a9bf-adc4-4968-9859-ae90f6d92779"
          fetch led-lobby "hf_20260706_111104_633630bc-fc64-4d96-bbc2-7b9ca998e85d"
          fetch immersive-museum "hf_20260706_111224_07f2b633-d9d9-4f53-832d-ea12b6d3a5fa"
          ls -lh public/videos

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Extract poster frames
        run: |
          for n in control-room led-lobby immersive-museum; do
            [ -f "public/videos/$n.mp4" ] || continue
            ffmpeg -y -i "public/videos/$n.mp4" -vf "select=eq(n\,12),scale=1600:-2" -frames:v 1 -q:v 3 "public/posters/$n.jpg"
          done
          ls -lh public/posters

      - name: Commit media to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/videos public/posters
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Add reference-driven Seedance video assets and posters"
          git push

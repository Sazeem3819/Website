# One-shot helper: fetches freely-licensed control-room photo candidates
# from Wikimedia Commons into media-candidates/ so one can be picked as the
# Control Room section background. Run manually via workflow_dispatch.
name: Fetch media candidates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch control-room photo candidates from Wikimedia Commons
        run: |
          mkdir -p media-candidates
          : > media-candidates/credits.txt
          i=0
          fetch_query() {
            local q="$1"
            curl -fsSL --get 'https://commons.wikimedia.org/w/api.php' \
              --data-urlencode 'action=query' \
              --data-urlencode 'generator=search' \
              --data-urlencode "gsrsearch=$q filemime:jpeg" \
              --data-urlencode 'gsrnamespace=6' \
              --data-urlencode 'gsrlimit=8' \
              --data-urlencode 'prop=imageinfo' \
              --data-urlencode 'iiprop=url|size|extmetadata' \
              --data-urlencode 'iiurlwidth=1920' \
              --data-urlencode 'format=json' \
              -H 'User-Agent: TSSCO-website-build/1.0 (contact: repo owner)' \
            | jq -r '
                .query.pages // {} | to_entries[] | .value
                | select(.imageinfo[0].width >= 1600)
                | select((.imageinfo[0].height / .imageinfo[0].width) < 0.85)
                | [ .title,
                    (.imageinfo[0].thumburl // .imageinfo[0].url),
                    (.imageinfo[0].extmetadata.LicenseShortName.value // "unknown"),
                    ((.imageinfo[0].extmetadata.Artist.value // "unknown") | gsub("<[^>]*>"; "") | gsub("\\n"; " "))
                  ] | @tsv' \
            | head -4 \
            | while IFS=$'\t' read -r title url license artist; do
                i=$((i+1))
                n=$(printf '%02d' "$i")
                out="media-candidates/candidate-$n-$(echo "$q" | tr ' ' '-' | tr -cd 'a-z-').jpg"
                if curl -fsSL -o "$out" -H 'User-Agent: TSSCO-website-build/1.0' "$url"; then
                  echo "$out | $title | $license | $artist | $url" >> media-candidates/credits.txt
                else
                  rm -f "$out"
                fi
              done
          }
          fetch_query 'network operations center'
          fetch_query 'security operations center'
          fetch_query 'control room video wall'
          fetch_query 'traffic management center operators'
          cat media-candidates/credits.txt
          ls -lh media-candidates

      - name: Commit candidates to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add media-candidates
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Add control-room photo candidates from Wikimedia Commons"
          git push

# Builds the site and publishes dist/ to the gh-pages branch, serving the
# public demo at https://sazeem3819.github.io/Website/
name: Deploy demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [claude/tssco-cinematic-scroll-sdviwz]

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          VITE_BASE=/Website/ npm run build
          # SPA fallback so deep links (/services, /work, …) resolve on Pages.
          cp dist/index.html dist/404.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Ensure Pages is enabled for the gh-pages branch
        run: |
          status=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "create-pages returned HTTP $status"
          cat /tmp/pages.json
          # 201 = newly enabled, 409 = already enabled — both fine.
          [ "$status" = "201" ] || [ "$status" = "409" ] || exit 1
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages"

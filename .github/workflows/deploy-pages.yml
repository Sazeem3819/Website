# Builds the site and deploys it to GitHub Pages via the official Pages
# actions (self-enabling), serving https://sazeem3819.github.io/Website/
name: Deploy demo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [claude/tssco-cinematic-scroll-sdviwz]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          VITE_BASE=/Website/ npm run build
          # SPA fallback so deep links (/services, /work, …) resolve on Pages.
          cp dist/index.html dist/404.html

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
